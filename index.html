<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlackSwan AI Chatbot</title>
  <script type="module">
    // Mermaid renders ```mermaid code blocks into real diagrams.
    // Loaded as a module so the chat still works if the CDN is unreachable.
    try {
      const mermaid = (await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs")).default;
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: "strict",
        theme: "dark",
        fontFamily: "'Inter', system-ui, sans-serif",
        flowchart: { curve: "basis", useMaxWidth: false },
        sequence: { useMaxWidth: false },
      });
      window.mermaid = mermaid;
    } catch (e) {
      console.warn("Mermaid unavailable — diagrams will show as code:", e);
    }
  </script>
  <style>
    /* ── Reset ──────────────────────────────────────────────────── */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #060612;
      --surface: rgba(13, 13, 32, 0.72);
      --border: rgba(139, 92, 246, 0.18);
      --accent: #8b5cf6;
      --accent2: #7c3aed;
      --accentLo: rgba(139, 92, 246, 0.12);
      --fg: #e8eaf6;
      --muted: #7b7fa8;
      --success: #34d399;
      --danger: #f87171;
      --radius: 14px;
      --font: 'Inter', system-ui, sans-serif;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    button {
      cursor: pointer;
      font-family: inherit;
      font-size: inherit;
      border: none;
      background: none;
    }

    textarea {
      font-family: inherit;
      font-size: inherit;
    }

    ::selection {
      background: rgba(139, 92, 246, 0.3);
    }

    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(139, 92, 246, 0.25);
      border-radius: 99px;
    }

    /* ── Layout ─────────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 960px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ── Header ─────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 0;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-orb {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      box-shadow: 0 0 20px rgba(124, 58, 237, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: orbPulse 3s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes orbPulse {

      0%,
      100% {
        box-shadow: 0 0 14px rgba(124, 58, 237, 0.5);
      }

      50% {
        box-shadow: 0 0 32px rgba(124, 58, 237, 0.9);
      }
    }

    .logo-orb svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    .logo-name {
      font-size: 1.1rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .logo-name sup {
      color: var(--accent);
      font-size: 0.55rem;
      vertical-align: super;
    }

    .header-status {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.72rem;
      color: var(--muted);
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      animation: blink 2s ease-in-out infinite;
    }

    .status-dot.offline {
      background: var(--danger);
      animation: none;
    }

    @keyframes blink {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: 0.3;
      }
    }

    /* ── Messages ───────────────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px 0 8px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    /* Welcome */
    .welcome {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 12px;
      padding: 40px 20px;
      color: var(--muted);
    }

    .welcome h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -0.02em;
    }

    .welcome p {
      font-size: 0.875rem;
      max-width: 380px;
      line-height: 1.7;
    }

    .suggestions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 8px;
    }

    .suggestion-chip {
      padding: 7px 14px;
      border-radius: 99px;
      border: 1px solid var(--border);
      background: var(--accentLo);
      color: var(--muted);
      font-size: 0.8rem;
      transition: all 0.18s;
    }

    .suggestion-chip:hover {
      color: var(--fg);
      border-color: rgba(139, 92, 246, 0.45);
      background: rgba(139, 92, 246, 0.18);
    }

    /* Message rows */
    .msg {
      display: flex;
      gap: 10px;
      animation: msgIn 0.28s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes msgIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .msg.user {
      flex-direction: row-reverse;
    }

    .avatar {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      flex-shrink: 0;
      align-self: flex-end;
    }

    .avatar.ai {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      box-shadow: 0 0 12px rgba(124, 58, 237, 0.4);
      color: white;
      font-size: 0.6rem;
      letter-spacing: 0.05em;
    }

    .avatar.user {
      background: rgba(139, 92, 246, 0.2);
      border: 1px solid rgba(139, 92, 246, 0.35);
      color: var(--accent);
    }

    .bubble {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: var(--radius);
      font-size: 0.92rem;
      line-height: 1.7;
      word-break: break-word;
    }

    .bubble.ai {
      background: var(--surface);
      border: 1px solid var(--border);
      backdrop-filter: blur(12px);
      border-bottom-left-radius: 4px;
    }

    .bubble.user {
      background: linear-gradient(135deg, #7c3aed, #6d28d9);
      color: white;
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 18px rgba(124, 58, 237, 0.35);
      white-space: pre-wrap;
    }

    /* ── Task list checkboxes ──────────────────────────────────── */
    .bubble.ai .task-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 15px;
      height: 15px;
      margin-right: 8px;
      border-radius: 4px;
      border: 1px solid rgba(139, 92, 246, 0.5);
      color: var(--accent);
      font-size: 0.7rem;
      line-height: 1;
      vertical-align: -2px;
    }

    .bubble.ai .task-box.done {
      background: rgba(139, 92, 246, 0.25);
    }

    /* ── Mermaid diagrams ──────────────────────────────────────── */
    .bubble.ai .mermaid-block {
      margin: 18px 0;
      padding: 16px;
      background: rgba(8, 8, 22, 0.72);
      border: 1px solid rgba(139, 92, 246, 0.28);
      border-radius: 12px;
      overflow-x: auto;
      text-align: center;
    }

    /* Render diagrams at full size and scroll horizontally rather than
       shrinking them until the labels are unreadable. */
    .bubble.ai .mermaid-block svg {
      max-width: none !important;
      height: auto;
    }

    .bubble.ai .mermaid-block .edgeLabel,
    .bubble.ai .mermaid-block .edgeLabel p {
      background: transparent !important;
      color: #cfd2ef !important;
    }

    .bubble.ai .mermaid-block .edgeLabel rect {
      opacity: 0 !important;
    }

    .bubble.ai .mermaid-error {
      color: var(--muted);
      font-size: 0.78rem;
      margin-bottom: 6px;
    }

    /* ── Markdown styles inside .bubble.ai ─────────────────────── */

    /* Overall bubble spacing reset */
    .bubble.ai .md {
      display: block;
    }

    /* Paragraphs — generous bottom gap */
    .bubble.ai p {
      margin: 0 0 14px;
      line-height: 1.75;
    }

    .bubble.ai p:last-child {
      margin-bottom: 0;
    }

    /* Headings — clear size hierarchy + breathing room */
    .bubble.ai h1 {
      font-size: 1.35rem;
      font-weight: 800;
      color: #f0eaff;
      margin: 22px 0 10px;
      line-height: 1.25;
      letter-spacing: -0.02em;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(139, 92, 246, 0.25);
    }

    .bubble.ai h2 {
      font-size: 1.12rem;
      font-weight: 700;
      color: #e2d9ff;
      margin: 20px 0 8px;
      line-height: 1.3;
      letter-spacing: -0.01em;
    }

    .bubble.ai h3 {
      font-size: 1rem;
      font-weight: 700;
      color: #c4b5fd;
      margin: 16px 0 6px;
      line-height: 1.35;
      letter-spacing: 0.01em;
    }

    .bubble.ai h4,
    .bubble.ai h5,
    .bubble.ai h6 {
      font-size: 0.92rem;
      font-weight: 600;
      color: #a78bfa;
      margin: 12px 0 5px;
    }

    /* Remove extra top margin on first heading */
    .bubble.ai h1:first-child,
    .bubble.ai h2:first-child,
    .bubble.ai h3:first-child {
      margin-top: 4px;
    }

    /* Lists */
    .bubble.ai ul,
    .bubble.ai ol {
      padding-left: 22px;
      margin: 6px 0 14px;
    }

    .bubble.ai ul {
      list-style: none;
      padding-left: 0;
    }

    .bubble.ai ul>li {
      padding-left: 20px;
      position: relative;
      margin-bottom: 7px;
      line-height: 1.65;
    }

    .bubble.ai ul>li::before {
      content: "▸";
      position: absolute;
      left: 0;
      color: var(--accent);
      font-size: 0.75rem;
      top: 3px;
    }

    .bubble.ai ol {
      list-style: none;
      counter-reset: ol-counter;
      padding-left: 0;
    }

    .bubble.ai ol>li {
      counter-increment: ol-counter;
      padding-left: 32px;
      position: relative;
      margin-bottom: 9px;
      line-height: 1.65;
    }

    .bubble.ai ol>li::before {
      content: counter(ol-counter) ".";
      position: absolute;
      left: 0;
      color: #c4b5fd;
      font-weight: 700;
      font-size: 0.82rem;
      min-width: 24px;
      top: 1px;
    }

    /* Nested lists */
    .bubble.ai li ul,
    .bubble.ai li ol {
      margin: 6px 0 4px;
    }

    /* Inline emphasis */
    .bubble.ai strong,
    .bubble.ai b {
      font-weight: 700;
      color: #e2d9ff;
    }

    .bubble.ai em,
    .bubble.ai i {
      font-style: italic;
      color: #a78bfa;
    }

    /* Inline code */
    .bubble.ai code {
      font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
      font-size: 0.8rem;
      background: rgba(139, 92, 246, 0.18);
      border: 1px solid rgba(139, 92, 246, 0.28);
      border-radius: 5px;
      padding: 1px 7px;
      color: #c4b5fd;
      white-space: nowrap;
    }

    /* Code block */
    .bubble.ai pre {
      background: rgba(6, 4, 20, 0.88);
      border: 1px solid rgba(139, 92, 246, 0.22);
      border-radius: 10px;
      padding: 14px 16px;
      overflow-x: auto;
      margin: 12px 0;
    }

    .bubble.ai pre code {
      background: none;
      border: none;
      padding: 0;
      font-size: 0.82rem;
      color: #e2e8f0;
      line-height: 1.65;
      white-space: pre;
    }

    /* Blockquote */
    .bubble.ai blockquote {
      border-left: 3px solid var(--accent);
      margin: 12px 0;
      padding: 8px 16px;
      color: var(--muted);
      font-style: italic;
      background: rgba(139, 92, 246, 0.07);
      border-radius: 0 8px 8px 0;
    }

    /* Divider */
    .bubble.ai hr {
      border: none;
      border-top: 1px solid rgba(139, 92, 246, 0.2);
      margin: 16px 0;
    }

    /* Links */
    .bubble.ai a {
      color: var(--accent);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* Tables */
    .bubble.ai table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 0.85rem;
    }

    .bubble.ai th,
    .bubble.ai td {
      border: 1px solid rgba(139, 92, 246, 0.2);
      padding: 7px 12px;
      text-align: left;
    }

    .bubble.ai th {
      background: rgba(139, 92, 246, 0.14);
      font-weight: 600;
      color: #c4b5fd;
    }

    .bubble.ai tr:nth-child(even) td {
      background: rgba(139, 92, 246, 0.04);
    }

    /* transcript badge */
    .transcript-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(52, 211, 153, 0.12);
      border: 1px solid rgba(52, 211, 153, 0.25);
      border-radius: 99px;
      padding: 2px 10px 2px 8px;
      font-size: 0.72rem;
      color: var(--success);
      margin-bottom: 10px;
    }

    .transcript-badge svg {
      width: 12px;
      height: 12px;
      fill: currentColor;
    }

    /* ── Thinking dots ───────────────────────────────────────────── */
    .thinking {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 14px 18px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      width: fit-content;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }

    .dot:nth-child(1) {
      animation: dotBounce 0.8s ease-in-out infinite;
    }

    .dot:nth-child(2) {
      animation: dotBounce 0.8s ease-in-out 0.14s infinite;
    }

    .dot:nth-child(3) {
      animation: dotBounce 0.8s ease-in-out 0.28s infinite;
    }

    @keyframes dotBounce {

      0%,
      100% {
        transform: translateY(0);
        opacity: 0.4;
      }

      50% {
        transform: translateY(-6px);
        opacity: 1;
      }
    }

    /* ── Input area ─────────────────────────────────────────────── */
    #input-area {
      flex-shrink: 0;
      padding: 12px 0 20px;
      border-top: 1px solid var(--border);
      position: relative;
    }

    .input-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
    }

    #prompt-box {
      flex: 1;
      min-height: 48px;
      max-height: 160px;
      padding: 13px 16px;
      background: rgba(139, 92, 246, 0.07);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 12px;
      color: var(--fg);
      resize: none;
      outline: none;
      line-height: 1.5;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #prompt-box:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.14);
    }

    #prompt-box::placeholder {
      color: var(--muted);
    }

    .icon-btn {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.18s;
    }

    #mic-btn {
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.2);
      color: var(--muted);
    }

    #mic-btn:hover {
      background: rgba(139, 92, 246, 0.2);
      color: var(--fg);
    }

    #send-btn {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
      color: white;
      box-shadow: 0 4px 16px rgba(124, 58, 237, 0.4);
    }

    #send-btn:hover {
      box-shadow: 0 6px 24px rgba(124, 58, 237, 0.65);
      transform: translateY(-1px);
    }

    #send-btn:active {
      transform: translateY(0);
    }

    #send-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }

    #mic-btn svg,
    #send-btn svg {
      width: 20px;
      height: 20px;
    }

    .input-hint {
      margin-top: 7px;
      font-size: 0.7rem;
      color: var(--muted);
      text-align: center;
      opacity: 0.7;
    }

    kbd {
      display: inline-block;
      padding: 1px 5px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      font-size: 0.65rem;
      font-family: inherit;
    }

    /* ══════════════════════════════════════════════════════════════
   SIRI-STYLE VOICE OVERLAY
══════════════════════════════════════════════════════════════ */
    #voice-overlay {
      display: none;
      /* shown via .active */
      position: absolute;
      bottom: calc(100% + 10px);
      /* sits just above the input area */
      left: 0;
      right: 0;
      background: rgba(8, 6, 24, 0.92);
      border: 1px solid rgba(139, 92, 246, 0.28);
      border-radius: 20px;
      padding: 22px 20px 18px;
      backdrop-filter: blur(24px);
      box-shadow: 0 -8px 40px rgba(139, 92, 246, 0.15), 0 0 0 1px rgba(139, 92, 246, 0.1);
      z-index: 100;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      animation: overlayIn 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    #voice-overlay.active {
      display: flex;
    }

    @keyframes overlayIn {
      from {
        opacity: 0;
        transform: translateY(10px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* ── Siri orb ── */
    #siri-orb {
      position: relative;
      width: 72px;
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Base circle */
    #siri-orb .orb-core {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed, #a855f7, #c084fc);
      box-shadow:
        0 0 0 0 rgba(139, 92, 246, 0.6),
        0 0 24px rgba(139, 92, 246, 0.5);
      animation: siriPulse 1.4s ease-in-out infinite;
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #siri-orb .orb-core svg {
      width: 28px;
      height: 28px;
      fill: white;
    }

    /* Ripple rings */
    #siri-orb .ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(139, 92, 246, 0.5);
      animation: siriRing 1.8s ease-out infinite;
    }

    #siri-orb .ring:nth-child(2) {
      animation-delay: 0.4s;
    }

    #siri-orb .ring:nth-child(3) {
      animation-delay: 0.8s;
    }

    @keyframes siriPulse {

      0%,
      100% {
        box-shadow: 0 0 0 0 rgba(139, 92, 246, 0.6), 0 0 24px rgba(139, 92, 246, 0.5);
        transform: scale(1);
      }

      50% {
        box-shadow: 0 0 0 12px rgba(139, 92, 246, 0), 0 0 40px rgba(139, 92, 246, 0.8);
        transform: scale(1.06);
      }
    }

    @keyframes siriRing {
      0% {
        transform: scale(1);
        opacity: 0.7;
      }

      100% {
        transform: scale(2.4);
        opacity: 0;
      }
    }

    /* Dynamic sound bars  — mirror of real mic level */
    #siri-bars {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 36px;
      width: 100%;
    }

    .sbar {
      width: 4px;
      border-radius: 3px;
      background: linear-gradient(180deg, #c084fc, #7c3aed);
      transition: height 0.08s ease;
      min-height: 4px;
    }

    /* idle fallback animation (before real audio data) */
    .sbar:nth-child(1) {
      animation: sb 1.1s 0.00s ease-in-out infinite;
    }

    .sbar:nth-child(2) {
      animation: sb 1.1s 0.07s ease-in-out infinite;
    }

    .sbar:nth-child(3) {
      animation: sb 1.1s 0.14s ease-in-out infinite;
    }

    .sbar:nth-child(4) {
      animation: sb 1.1s 0.21s ease-in-out infinite;
    }

    .sbar:nth-child(5) {
      animation: sb 1.1s 0.28s ease-in-out infinite;
    }

    .sbar:nth-child(6) {
      animation: sb 1.1s 0.21s ease-in-out infinite;
    }

    .sbar:nth-child(7) {
      animation: sb 1.1s 0.14s ease-in-out infinite;
    }

    .sbar:nth-child(8) {
      animation: sb 1.1s 0.07s ease-in-out infinite;
    }

    .sbar:nth-child(9) {
      animation: sb 1.1s 0.00s ease-in-out infinite;
    }

    .sbar.live {
      animation: none;
    }

    /* JS takes over when we have real data */
    @keyframes sb {

      0%,
      100% {
        height: 5px;
        opacity: 0.4;
      }

      50% {
        height: 22px;
        opacity: 1;
      }
    }

    /* Status label */
    #voice-status-line {
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.01em;
      text-align: center;
      min-height: 1.2em;
    }

    #voice-interim {
      width: 100%;
      text-align: center;
      font-size: 0.88rem;
      color: rgba(196, 181, 253, 0.75);
      min-height: 1.5em;
      font-style: italic;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Tap-to-stop hint */
    #voice-stop-btn {
      font-size: 0.75rem;
      color: rgba(255, 255, 255, 0.3);
      padding: 4px 16px;
      border-radius: 99px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.18s;
      background: transparent;
    }

    #voice-stop-btn:hover {
      color: var(--fg);
      border-color: rgba(139, 92, 246, 0.4);
    }

    /* mic button active glow */
    #mic-btn.listening {
      background: linear-gradient(135deg, rgba(139, 92, 246, 0.3), rgba(168, 85, 247, 0.25));
      border-color: rgba(139, 92, 246, 0.6);
      color: #c4b5fd;
      box-shadow: 0 0 18px rgba(139, 92, 246, 0.45);
    }

    /* ── Toast ──────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.35);
      color: var(--danger);
      padding: 10px 18px;
      border-radius: 99px;
      font-size: 0.82rem;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
      z-index: 9999;
      backdrop-filter: blur(12px);
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
    }

    @media (max-width: 600px) {
      .bubble {
        max-width: 88%;
      }

      #voice-overlay {
        border-radius: 16px;
      }
    }
  </style>
</head>

  <!-- Toast -->
  <div id="toast" role="alert" aria-live="assertive"></div>

  <script>
    /* ─────────────────────────────────────────────────────────────────────────
       CONFIG
    ───────────────────────────────────────────────────────────────────────── */
    const API_BASE = window.location.origin;

    /* ─────────────────────────────────────────────────────────────────────────
       STATE
    ───────────────────────────────────────────────────────────────────────── */
    const chatHistory = [];
    let streaming = false;

    // Recording state
    let mediaRec = null;
    let audioChunks = [];
    let audioStream = null;
    let analyser = null;
    let audioCtx = null;
    let animRaf = null;

    // Web Speech API (interim transcripts into textarea)
    let recognition = null;
    let interimText = "";

    /* ─────────────────────────────────────────────────────────────────────────
       DOM
    ───────────────────────────────────────────────────────────────────────── */
    const messagesEl = document.getElementById("messages");
    const promptBox = document.getElementById("prompt-box");
    const sendBtn = document.getElementById("send-btn");
    const micBtn = document.getElementById("mic-btn");
    const voiceOverlay = document.getElementById("voice-overlay");
    const voiceInterim = document.getElementById("voice-interim");
    const voiceStatus = document.getElementById("voice-status-line");
    const sbirBars = document.querySelectorAll(".sbar");
    const statusDot = document.getElementById("status-dot");
    const statusText = document.getElementById("status-text");
    const toast = document.getElementById("toast");

    /* ─────────────────────────────────────────────────────────────────────────
       HEALTH
    ───────────────────────────────────────────────────────────────────────── */
    async function checkHealth() {
      try {
        const r = await fetch(`${API_BASE}/health`);
        if (r.ok) { const d = await r.json(); setStatus(true, d.model); }
        else { setStatus(false, "Server error"); }
      } catch { setStatus(false, "Offline"); }
    }
    function setStatus(online, label) {
      statusDot.className = "status-dot" + (online ? "" : " offline");
      statusText.textContent = online ? `Online · ${label}` : label;
    }

    /* ─────────────────────────────────────────────────────────────────────────
       WELCOME
    ───────────────────────────────────────────────────────────────────────── */
    const SUGGESTIONS = [
      "What should I focus on today?",
      "How do I build a good morning routine?",
      "Explain RAG in simple terms",
      "What makes a great AI product?",
      "How do I start my startup journey?",
    ];
    function showWelcome() {
      messagesEl.innerHTML = `
    <div class="welcome">
      <div class="logo-orb" style="width:52px;height:52px;margin-bottom:8px">
        <svg viewBox="0 0 24 24" style="width:26px;height:26px;fill:white">
          <path d="M12 2C8.5 2 6 4.5 6 7c0 1.8 1 3.4 2.5 4.3L5 20h14l-3.5-8.7C17 10.4 18 8.8 18 7c0-2.5-2.5-5-6-5zm0 2c2.2 0 4 1.5 4 3 0 1.3-.8 2.4-2 3l-2 .7-2-.7c-1.2-.6-2-1.7-2-3 0-1.5 1.8-3 4-3z"/>
        </svg>
      </div>
      <h2>How can I help you today?</h2>
      <p>Type a message or tap the mic to speak. I'll answer instantly.</p>
      <div class="suggestions">
        ${SUGGESTIONS.map(s => `<button class="suggestion-chip" onclick="useSuggestion(this)">${s}</button>`).join("")}
      </div>
    </div>`;
    }
    function useSuggestion(el) {
      promptBox.value = el.textContent;
      promptBox.dispatchEvent(new Event("input"));
      sendText();
    }

    /* ─────────────────────────────────────────────────────────────────────────
       MARKDOWN RENDERER  — block-first line-by-line parser
       Handles: fenced code, headings, hr, blockquote, ordered list,
                unordered list, blank lines, tables, and paragraphs.
       Inline: bold, italic, bold+italic, inline code, links.
       No external library. No XSS.
    ───────────────────────────────────────────────────────────────────────── */
    function renderMarkdown(raw) {
      // ── Helpers ────────────────────────────────────────────────
      function esc(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      // Apply inline markdown to an already-escaped string.
      // Order matters: bold+italic > bold > italic > code > links
      function inline(s) {
        // inline code first (prevent further processing inside)
        const codes = [];
        s = s.replace(/`([^`]+)`/g, (_, c) => {
          codes.push(`<code>${esc(c)}</code>`);
          return `\x00${codes.length - 1}\x00`;
        });
        // bold+italic
        s = s.replace(/\*\*\*(.+?)\*\*\*/g, "<strong><em>$1</em></strong>");
        s = s.replace(/___(.+?)___/g, "<strong><em>$1</em></strong>");
        // bold
        s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
        s = s.replace(/__(.+?)__/g, "<strong>$1</strong>");
        // italic
        s = s.replace(/\*([^*\n]+)\*/g, "<em>$1</em>");
        s = s.replace(/_([^_\n]+)_/g, "<em>$1</em>");
        // strikethrough
        s = s.replace(/~~(.+?)~~/g, "<del>$1</del>");
        // links  [text](url)
        s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,
          (_, text, href) => `<a href="${esc(href)}" target="_blank" rel="noopener">${text}</a>`);
        // restore inline codes
        s = s.replace(/\x00(\d+)\x00/g, (_, i) => codes[+i]);
        return s;
      }

      // ── Tokenise into lines ────────────────────────────────────
      const lines = raw.split("\n");
      const out = [];
      let i = 0;

      // flush a paragraph buffer
      let paraLines = [];
      function flushPara() {
        if (!paraLines.length) return;
        out.push(`<p>${inline(paraLines.join(" ").trim())}</p>`);
        paraLines = [];
      }

      while (i < lines.length) {
        const line = lines[i];

        // ── Fenced code block  ``` ─────────────────────────────
        const fenceMatch = line.match(/^\s*```\s*([\w+#.-]*)\s*$/);
        if (fenceMatch) {
          flushPara();
          const lang = fenceMatch[1] || "";
          const codeLines = [];
          i++;
          while (i < lines.length && !/^\s*```/.test(lines[i])) {
            codeLines.push(lines[i]);
            i++;
          }
          i++; // skip closing ```
          const code = codeLines.join("\n");
          if (lang.toLowerCase() === "mermaid") {
            // Rendered into an SVG once the stream finishes (see renderDiagrams)
            out.push(
              `<div class="mermaid-block" data-mermaid="${esc(code)}">` +
              `<pre><code class="language-mermaid">${esc(code)}</code></pre></div>`
            );
          } else {
            out.push(`<pre><code class="language-${esc(lang)}">${esc(code)}</code></pre>`);
          }
          continue;
        }

        // ── Heading  # ## ### ─────────────────────────────────
        const headMatch = line.match(/^(#{1,6})\s+(.+)$/);
        if (headMatch) {
          flushPara();
          const level = headMatch[1].length;
          out.push(`<h${level}>${inline(esc(headMatch[2]))}</h${level}>`);
          i++; continue;
        }

        // ── Horizontal rule  --- *** ___ ──────────────────────
        if (/^(\-{3,}|\*{3,}|_{3,})\s*$/.test(line)) {
          flushPara();
          out.push("<hr/>");
          i++; continue;
        }

        // ── Blockquote  > ─────────────────────────────────────
        if (line.startsWith("> ") || line === ">") {
          flushPara();
          const bqLines = [];
          while (i < lines.length && (lines[i].startsWith("> ") || lines[i] === ">")) {
            bqLines.push(lines[i].replace(/^>\s?/, ""));
            i++;
          }
          // Recursively render blockquote content
          out.push(`<blockquote>${renderMarkdown(bqLines.join("\n"))}</blockquote>`);
          continue;
        }

        // ── Lists (nested, ordered + unordered, task items) ────
        if (LIST_ITEM_RE.test(line)) {
          flushPara();
          const block = [];
          while (i < lines.length) {
            const l = lines[i];
            if (l.trim() === "") {
              // A blank line only continues the list if another item follows
              const next = lines[i + 1];
              if (next === undefined || !LIST_ITEM_RE.test(next)) break;
              i++;
              continue;
            }
            const isItem = LIST_ITEM_RE.test(l);
            // A non-item, indented line continues the previous item
            const isContinuation = block.length > 0 && /^\s{2,}\S/.test(l);
            if (!isItem && !isContinuation) break;
            block.push(l);
            i++;
          }
          out.push(renderList(block, inline, esc));
          continue;
        }

        // ── Table  | col | col | ──────────────────────────────
        if (line.startsWith("|") && i + 1 < lines.length && /^\|[-| :]+\|/.test(lines[i + 1])) {
          flushPara();
          const headerCells = line.split("|").filter(c => c.trim())
            .map(c => `<th>${inline(esc(c.trim()))}</th>`).join("");
          i += 2; // skip header + separator
          const rows = [];
          while (i < lines.length && lines[i].startsWith("|")) {
            const cells = lines[i].split("|").filter(c => c.trim())
              .map(c => `<td>${inline(esc(c.trim()))}</td>`).join("");
            rows.push(`<tr>${cells}</tr>`);
            i++;
          }
          out.push(
            `<table><thead><tr>${headerCells}</tr></thead>` +
            `<tbody>${rows.join("")}</tbody></table>`
          );
          continue;
        }

        // ── Blank line — flush paragraph ──────────────────────
        if (line.trim() === "") {
          flushPara();
          i++; continue;
        }

        // ── Regular text — accumulate into paragraph ──────────
        paraLines.push(line);
        i++;
      }

      flushPara(); // flush any remaining text
      return out.join("\n");
    }

    // Matches `- item`, `* item`, `+ item`, `1. item`, `2) item` with any indent
    const LIST_ITEM_RE = /^(\s*)([-*+]|\d+[.)])\s+(.*)$/;

    /* Build (possibly nested) <ul>/<ol> markup from a block of list lines. */
    function renderList(src, inline, esc) {
      let idx = 0;

      function indentOf(line) {
        return line.match(/^\s*/)[0].replace(/\t/g, "  ").length;
      }

      function parse(indent) {
        const ordered = /\d/.test(src[idx].match(LIST_ITEM_RE)[2]);
        const items = [];

        while (idx < src.length) {
          const m = src[idx].match(LIST_ITEM_RE);
          if (!m) {
            // wrapped continuation line — append to the current item
            if (!items.length) break;
            items[items.length - 1].text += " " + src[idx].trim();
            idx++;
            continue;
          }
          const ind = indentOf(src[idx]);
          if (ind < indent) break;
          if (ind > indent) {
            if (!items.length) break;
            items[items.length - 1].children.push(parse(ind));
            continue;
          }
          const sameKind = /\d/.test(m[2]) === ordered;
          if (!sameKind) break;
          items.push({ text: m[3], children: [] });
          idx++;
        }

        const tag = ordered ? "ol" : "ul";
        const html = items.map(it => {
          let text = it.text;
          let prefix = "";
          const task = text.match(/^\[([ xX])\]\s+(.*)$/);
          if (task) {
            prefix = `<span class="task-box${task[1] === " " ? "" : " done"}">${task[1] === " " ? "" : "✓"}</span>`;
            text = task[2];
          }
          return `<li>${prefix}${inline(esc(text))}${it.children.join("")}</li>`;
        }).join("");
        return `<${tag}>${html}</${tag}>`;
      }

      let out = "";
      while (idx < src.length) {
        const before = idx;
        out += parse(indentOf(src[idx]));
        if (idx === before) break; // safety: never loop forever
      }
      return out;
    }

    /* Repair the mermaid syntax slips LLMs make most often. */
    function sanitizeMermaid(src) {
      return src
        .replace(/(-{2,}>?\|[^|\n]*\|)>/g, "$1")   //  A -->|label|> B   →  A -->|label| B
        .replace(/\u00a0/g, " ");                  //  non-breaking spaces
    }

    /* Turn every ```mermaid block inside `root` into an SVG diagram.
       Called once a message has finished streaming, so half-written
       diagrams are never handed to mermaid. */
    let mermaidSeq = 0;
    async function renderDiagrams(root) {
      const blocks = root.querySelectorAll(".mermaid-block[data-mermaid]");
      if (!blocks.length || !window.mermaid) return;

      for (const block of blocks) {
        const source = sanitizeMermaid(block.getAttribute("data-mermaid"));
        try {
          const { svg } = await window.mermaid.render(`mmd-${++mermaidSeq}`, source);
          block.innerHTML = svg;
          block.removeAttribute("data-mermaid");
        } catch (err) {
          console.warn("Mermaid render failed:", err);
          block.removeAttribute("data-mermaid");
          block.insertAdjacentHTML("afterbegin",
            `<div class="mermaid-error">Diagram source (could not be rendered)</div>`);
        }
      }
    }

    /* ─────────────────────────────────────────────────────────────────────────
       MESSAGE RENDERING
    ───────────────────────────────────────────────────────────────────────── */
    function clearWelcome() {
      const w = messagesEl.querySelector(".welcome");
      if (w) w.remove();
    }

    function appendMsg(role, content, transcriptBadge) {
      clearWelcome();
      const row = document.createElement("div");
      row.classList.add("msg", role);

      const avatarLabel = role === "ai" ? "AI" : "You";

      if (role === "ai") {
        const badge = transcriptBadge
          ? `<div class="transcript-badge">
           <svg viewBox="0 0 20 20"><path d="M7 4a3 3 0 016 0v6a3 3 0 01-6 0V4zm-2 6a7 7 0 0014 0h-2a5 5 0 01-10 0H5zm7 9v-2h-4v2H6v1h8v-1h-2z"/></svg>
           Heard: ${escHtml(transcriptBadge)}
         </div>`
          : "";

        row.innerHTML = `
      <div class="avatar ai">${avatarLabel}</div>
      <div class="bubble ai">${badge}<span class="md-content"></span></div>`;

        messagesEl.appendChild(row);
        scrollToBottom();

        const span = row.querySelector(".md-content");
        // Return an update function so the caller can stream into it
        return {
          updateText(raw) {
            span.innerHTML = renderMarkdown(raw);
            scrollToBottom();
          },
          // Called once the stream is complete — renders mermaid diagrams
          finalize() {
            renderDiagrams(span).then(scrollToBottom);
          },
        };
      } else {
        // User bubble — plain text, no markdown needed
        row.innerHTML = `
      <div class="avatar user">${avatarLabel}</div>
      <div class="bubble user">${escHtml(content)}</div>`;
        messagesEl.appendChild(row);
        scrollToBottom();
        return null;
      }
    }

    function appendThinking() {
      clearWelcome();
      const row = document.createElement("div");
      row.classList.add("msg", "ai");
      row.id = "thinking-row";
      row.innerHTML = `
    <div class="avatar ai">AI</div>
    <div class="thinking" aria-label="AI is thinking">
      <div class="dot"></div><div class="dot"></div><div class="dot"></div>
    </div>`;
      messagesEl.appendChild(row);
      scrollToBottom();
    }
    function removeThinking() {
      const r = document.getElementById("thinking-row");
      if (r) r.remove();
    }

    function scrollToBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }
    function escHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }

    /* ─────────────────────────────────────────────────────────────────────────
       SSE STREAM READER
    ───────────────────────────────────────────────────────────────────────── */
    async function readStream(response, onToken, onTranscript) {
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buf = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split("\n");
        buf = lines.pop() ?? "";

        for (const line of lines) {
          if (!line.startsWith("data: ")) continue;
          const payload = line.slice(6);
          if (!payload) continue;

          // Events are JSON so Markdown newlines survive the SSE transport
          let evt;
          try {
            evt = JSON.parse(payload);
          } catch {
            onToken(payload);   // tolerate a plain-text server
            continue;
          }

          if (evt.type === "done") return;
          if (evt.type === "error") { showToast("⚠ " + evt.message); return; }
          if (evt.type === "transcript") { onTranscript?.(evt.text); continue; }
          if (evt.type === "token") onToken(evt.text);
        }
      }
    }

    /* ─────────────────────────────────────────────────────────────────────────
       TEXT SEND
    ───────────────────────────────────────────────────────────────────────── */
    async function sendText() {
      const text = promptBox.value.trim();
      if (!text || streaming) return;

      promptBox.value = "";
      promptBox.style.height = "auto";
      sendBtn.disabled = true;

      appendMsg("user", text);
      appendThinking();
      streaming = true;
      let fullReply = "";

      try {
        const res = await fetch(`${API_BASE}/chat`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text, history: chatHistory, temperature: 0.7, max_tokens: 4096 }),
        });
        if (!res.ok) {
          const e = await res.json().catch(() => ({ detail: "Unknown error" }));
          throw new Error(e.detail ?? `HTTP ${res.status}`);
        }
        removeThinking();
        const msgCtrl = appendMsg("ai", "");
        await readStream(res, (token) => {
          fullReply += token;
          msgCtrl.updateText(fullReply);
        });
        msgCtrl.finalize();
      } catch (err) {
        removeThinking();
        showToast(err.message);
      } finally {
        chatHistory.push({ role: "user", content: text });
        chatHistory.push({ role: "assistant", content: fullReply });
        streaming = false;
      }
    }

    /* ─────────────────────────────────────────────────────────────────────────
       SIRI VOICE OVERLAY — AUDIO VISUALISER
    ───────────────────────────────────────────────────────────────────────── */
    function startVisualiser(stream) {
      try {
        audioCtx = new AudioContext();
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 64;
        const source = audioCtx.createMediaStreamSource(stream);
        source.connect(analyser);
        const data = new Uint8Array(analyser.frequencyBinCount);
        const barCount = sbirBars.length;

        function draw() {
          analyser.getByteFrequencyData(data);
          for (let i = 0; i < barCount; i++) {
            // map bar index (0..8) to frequency bin
            const bin = Math.floor((i / barCount) * (data.length * 0.6));
            const v = data[bin] / 255;          // 0..1
            const h = Math.max(4, Math.round(v * 32)); // 4..32px
            sbirBars[i].style.height = `${h}px`;
            sbirBars[i].classList.add("live");
          }
          animRaf = requestAnimationFrame(draw);
        }
        animRaf = requestAnimationFrame(draw);
      } catch { /* analyser not critical */ }
    }

    function stopVisualiser() {
      cancelAnimationFrame(animRaf);
      sbirBars.forEach(b => { b.style.height = ""; b.classList.remove("live"); });
      try { audioCtx?.close(); } catch { }
      analyser = null; audioCtx = null;
    }

    /* ─────────────────────────────────────────────────────────────────────────
       WEB SPEECH API — LIVE INTERIM TRANSCRIPTS INTO TEXTAREA
    ───────────────────────────────────────────────────────────────────────── */
    function startRecognition() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) return;  // not supported — overlay still shows, just no live text

      recognition = new SR();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = "en-US";

      recognition.onresult = (e) => {
        let interim = "", final = "";
        for (const result of e.results) {
          if (result.isFinal) final += result[0].transcript;
          else interim += result[0].transcript;
        }
        // Write final parts directly into the textarea
        if (final) {
          promptBox.value += (promptBox.value ? " " : "") + final.trim();
          promptBox.dispatchEvent(new Event("input"));
        }
        // Show interim in the overlay only
        interimText = interim;
        voiceInterim.textContent = interim || (promptBox.value ? "Got it, keep going…" : "Listening…");
      };

      recognition.onerror = (e) => {
        if (e.error !== "no-speech" && e.error !== "aborted") {
          voiceStatus.textContent = `Speech error: ${e.error}`;
        }
      };

      recognition.start();
    }

    function stopRecognition() {
      try { recognition?.stop(); } catch { }
      recognition = null;
    }

    /* ─────────────────────────────────────────────────────────────────────────
       MIC TOGGLE
    ───────────────────────────────────────────────────────────────────────── */
    async function toggleMic() {
      if (mediaRec && mediaRec.state === "recording") {
        stopRecording();
      } else {
        await startRecording();
      }
    }

    async function startRecording() {
      if (streaming) { showToast("Wait for the current reply to finish first."); return; }

      try {
        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        audioChunks = [];

        const mimeType = [
          "audio/webm;codecs=opus",
          "audio/webm",
          "audio/ogg;codecs=opus",
          "audio/mp4",
        ].find(t => MediaRecorder.isTypeSupported(t)) ?? "";

        mediaRec = new MediaRecorder(audioStream, mimeType ? { mimeType } : {});
        mediaRec.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRec.onstop = () => processAudio();
        mediaRec.start(200);

        // ── Show Siri overlay ──
        voiceOverlay.classList.add("active");
        micBtn.classList.add("listening");
        voiceInterim.textContent = "Listening…";
        voiceStatus.textContent = "Speak now. Your words will appear below.";

        // Start live visualiser
        startVisualiser(audioStream);

        // Start live transcript (Web Speech API)
        startRecognition();

      } catch (err) {
        showToast("Microphone access denied — " + err.message);
      }
    }

    function stopRecording() {
      if (!mediaRec || mediaRec.state === "inactive") return;
      mediaRec.stop();

      // ── Hide Siri overlay ──
      voiceOverlay.classList.remove("active");
      micBtn.classList.remove("listening");

      // Stop live transcript
      stopRecognition();

      // Stop visualiser
      stopVisualiser();

      // Release mic
      audioStream?.getTracks().forEach(t => t.stop());
    }

    /* ─────────────────────────────────────────────────────────────────────────
       PROCESS RECORDED AUDIO → BACKEND
    ───────────────────────────────────────────────────────────────────────── */
    async function processAudio() {
      if (audioChunks.length === 0) { showToast("No audio captured."); return; }

      // If the user already has text in the box (from Web Speech), just send that
      // and skip the Whisper round-trip (faster, cheaper).
      const liveTranscript = promptBox.value.trim();
      if (liveTranscript) {
        audioChunks = [];
        sendText();
        return;
      }

      // No live transcript — send audio to Whisper
      const blob = new Blob(audioChunks, { type: mediaRec.mimeType || "audio/webm" });
      const ext = (mediaRec.mimeType || "").includes("ogg") ? "ogg"
        : (mediaRec.mimeType || "").includes("mp4") ? "mp4" : "webm";
      const file = new File([blob], `recording.${ext}`, { type: blob.type });

      appendThinking();
      streaming = true;

      const formData = new FormData();
      formData.append("audio", file);
      formData.append("history", JSON.stringify(chatHistory));
      formData.append("temperature", "0.7");
      formData.append("max_tokens", "4096");

      let transcript = "";
      let fullReply = "";

      try {
        const res = await fetch(`${API_BASE}/speech`, { method: "POST", body: formData });
        if (!res.ok) {
          const e = await res.json().catch(() => ({ detail: "Unknown error" }));
          throw new Error(e.detail ?? `HTTP ${res.status}`);
        }

        removeThinking();
        let msgCtrl = null;

        await readStream(
          res,
          (token) => {
            // Create the AI bubble on the first token
            if (!msgCtrl) msgCtrl = appendMsg("ai", "", transcript);
            fullReply += token;
            msgCtrl.updateText(fullReply);
          },
          (t) => {
            transcript = t;
            // Put the transcript in the textarea briefly so the user sees it,
            // then immediately show it as a user message
            promptBox.value = t;
            promptBox.dispatchEvent(new Event("input"));
            setTimeout(() => {
              appendMsg("user", t);
              promptBox.value = "";
              promptBox.dispatchEvent(new Event("input"));
            }, 80);
          }
        );
        msgCtrl?.finalize();
      } catch (err) {
        removeThinking();
        showToast(err.message);
      } finally {
        if (transcript) chatHistory.push({ role: "user", content: transcript });
        if (fullReply) chatHistory.push({ role: "assistant", content: fullReply });
        streaming = false;
        audioChunks = [];
      }
    }

    /* ─────────────────────────────────────────────────────────────────────────
       TOAST
    ───────────────────────────────────────────────────────────────────────── */
    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove("show"), 4500);
    }

    /* ─────────────────────────────────────────────────────────────────────────
       TEXTAREA AUTO-RESIZE & KEYBOARD
    ───────────────────────────────────────────────────────────────────────── */
    promptBox.addEventListener("input", () => {
      promptBox.style.height = "auto";
      promptBox.style.height = Math.min(promptBox.scrollHeight, 160) + "px";
      sendBtn.disabled = !promptBox.value.trim() || streaming;
    });

    promptBox.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendText(); }
    });

    /* ─────────────────────────────────────────────────────────────────────────
       INIT
    ───────────────────────────────────────────────────────────────────────── */
    showWelcome();
    checkHealth();
    setInterval(checkHealth, 30_000);
  </script>
</body>

</html>
